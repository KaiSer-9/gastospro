<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Añadir gasto · GastosPro</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101114;color:#f5f5f7;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.box{max-width:360px;margin:24px;padding:28px;border:1px solid #303139;border-radius:22px;background:#191a20;text-align:center}h1{font-size:24px}p{line-height:1.5;color:#c6c7ce}.ok{font-size:44px}a{display:inline-block;margin-top:12px;color:#fff;background:#6c5ce7;padding:12px 18px;border-radius:12px;text-decoration:none}</style></head><body><main class="box"><div class="ok" id="icon">⏳</div><h1 id="title">Guardando gasto…</h1><p id="message">Un momento, por favor.</p><a id="back" href="./">Abrir GastosPro</a></main><script>
(function(){
 const KEY='gastospro_v2_entries';
 const p=new URLSearchParams(location.search);
 const amount=Number(String(p.get('amount')||'').replace(',','.'));
 const category=(p.get('category')||'Otros').trim();
 const description=(p.get('description')||'').trim().slice(0,100);
 const date=p.get('date')||new Date().toLocaleDateString('en-CA');
 const allowed=['Comida','Coche','Casa','Compras','Ocio','Transporte','Suscripciones','Salud','Otros'];
 const el=id=>document.getElementById(id);
 try {
   if(!(amount>0)||!Number.isFinite(amount)) throw new Error('El importe no es válido. Vuelve a ejecutar el atajo e introduce una cantidad mayor que cero.');
   const categorySafe=allowed.includes(category)?category:'Otros';
   const entries=JSON.parse(localStorage.getItem(KEY)||'[]');
   entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount,type:'expense',category:categorySafe,description,date,created:Date.now()});
   localStorage.setItem(KEY,JSON.stringify(entries));
   el('icon').textContent='✅';el('title').textContent='¡Gasto guardado!';el('message').textContent=`${amount.toLocaleString('es-ES',{style:'currency',currency:'EUR'})} · ${categorySafe}${description?' · '+description:''}. Ya está registrado en GastosPro.`;
 } catch(e){el('icon').textContent='⚠️';el('title').textContent='No se pudo guardar';el('message').textContent=e.message||'Abre GastosPro una vez en Safari y vuelve a intentarlo.';}
})();
</script></body></html>
